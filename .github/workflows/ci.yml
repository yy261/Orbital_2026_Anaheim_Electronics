name: CI

# Runs the test suites and production builds on every push and pull request,
# so a change that breaks a test or the build is caught before it merges.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  server:
    name: Server (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - run: npm run build

  client:
    name: Client (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      # devDependencies must be present for the TypeScript build to run.
      - run: npm run build
